<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23317a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蔵">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>蔵 — 読んだ・観たものの部屋</title>
<style>
:root{
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);--spring:cubic-bezier(.34,1.5,.5,1);
  --paper:#f3ecdf;--paperInk:#2a2420;
}
/* 部屋ごとの色 */
body,body[data-cat="manga"]{--room:#23317a;--room2:#1a255e;--ink:#f2f3fb;--sub:#a9b2df;--acc:#ffd23f;--accInk:#1b1f33;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--field:rgba(255,255,255,.09);--shelf:#121a4a;--glow:rgba(255,210,63,.18);color-scheme:dark}
body[data-cat="movie"]{--room:#3d0c18;--room2:#2b0711;--ink:#f8ecea;--sub:#d6a3ab;--acc:#f6c25b;--accInk:#2a0a12;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--field:rgba(255,255,255,.08);--shelf:#1f040b;--glow:rgba(246,194,91,.16);color-scheme:dark}
body[data-cat="book"]{--room:#143c2f;--room2:#0e2c22;--ink:#eef4ee;--sub:#9ec1b1;--acc:#f4a48c;--accInk:#2a1410;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--field:rgba(255,255,255,.08);--shelf:#0a2219;--glow:rgba(244,164,140,.16);color-scheme:dark}
body[data-cat="game"]{--room:#2a1d52;--room2:#1f1540;--ink:#f1eefb;--sub:#b3a8d8;--acc:#6ff0c8;--accInk:#14102a;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--field:rgba(255,255,255,.09);--shelf:#170f33;--glow:rgba(111,240,200,.16);color-scheme:dark}
body[data-cat="art"]{--room:#ecebe7;--room2:#e1e0da;--ink:#1c1c1e;--sub:#686763;--acc:#2541d6;--accInk:#ffffff;--card:rgba(0,0,0,.045);--line:rgba(0,0,0,.12);--field:rgba(0,0,0,.05);--shelf:#cfcdc6;--glow:rgba(37,65,214,.12);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--room);color:var(--ink);font:15px/1.65 var(--gothic);font-feature-settings:"palt";min-height:100dvh;overflow-x:hidden;transition:background-color .6s var(--ease),color .4s}
body.paged{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* 背景の大きな部屋の名前 */
.giant{position:fixed;top:calc(env(safe-area-inset-top) + 6vh);right:-2vw;z-index:0;pointer-events:none;writing-mode:vertical-rl;font:700 min(calc(72vh / var(--gl,2)),52vw)/1 var(--mincho);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.2px var(--line);will-change:transform}
.giant span{display:block;animation:gin .9s var(--ease) both}
.giant span.out{position:absolute;inset:0;animation:gout .5s var(--ease) both}
@keyframes gin{from{opacity:0;transform:translateY(18%)}}
@keyframes gout{to{opacity:0;transform:translateY(-14%)}}

.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px)}

/* 部屋の見出し */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.hd h1{margin:0;font:600 46px/1 var(--mincho);letter-spacing:.02em;overflow:hidden}
.hd h1 span{display:inline-block;animation:hin .6s var(--ease) both}
@keyframes hin{from{transform:translateY(100%)}}
.stat{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.stat b{font:600 18px/1 var(--mincho);color:var(--ink);margin:0 3px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--card);border:1px solid var(--line);transition:transform .2s var(--spring)}
.ib:active{transform:scale(.88)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);font-size:13px;color:var(--sub);white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .2s var(--spring)}
.chip small{margin-left:5px;opacity:.75}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:700}
.chip:active{transform:scale(.94)}

.tools{display:grid;grid-template-columns:1fr auto;grid-template-areas:"s s" "o v";gap:10px 8px;align-items:center;margin-bottom:20px}
.tools .sbox{grid-area:s}.tools .sortsel{grid-area:o;justify-self:start;max-width:none;padding:0 28px 0 12px}.tools .views{grid-area:v}
.sbox{position:relative;flex:1;min-width:0}
.search{width:100%;height:40px;padding:0 12px 0 36px;border-radius:20px;border:1px solid var(--line);background:var(--field);font-size:15px;color:var(--ink)}
.search::placeholder{color:var(--sub)}
.search:focus{outline:0;border-color:var(--acc)}
.sbox svg{position:absolute;left:12px;top:12px;color:var(--sub)}
.sortsel{flex:none;height:40px;max-width:92px;padding:0 6px;border-radius:20px;border:1px solid var(--line);background:var(--field);font-size:12.5px;color:var(--ink)}
.sortsel option{color:#222}
.views{flex:none;position:relative;display:flex;padding:3px;border-radius:20px;background:var(--field)}
.views .vi{position:absolute;top:3px;left:3px;width:36px;height:34px;border-radius:17px;background:var(--acc);transition:transform .45s var(--spring)}
.views button{position:relative;width:36px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--sub);transition:color .3s}
.views button.on{color:var(--accInk)}

/* ===== 棚：立体の背表紙（漫画・本） ===== */
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 4px;padding:0 6px;perspective:1100px;perspective-origin:50% -10%;
  background:repeating-linear-gradient(to bottom,transparent 0 204px,var(--shelf) 204px 214px,transparent 214px 226px)}
.sw{height:226px;display:flex;align-items:flex-end;padding-bottom:22px;transform-style:preserve-3d}
.spine{position:relative;width:var(--w);height:var(--h);background:var(--col);color:var(--fg);transform-style:preserve-3d;border-radius:2px 2px 0 0;
  writing-mode:vertical-rl;font:600 13.5px/1.15 var(--mincho);letter-spacing:.06em;padding:14px 0 24px;display:flex;align-items:center;
  transition:transform .45s var(--spring);animation:drop .7s var(--spring) both;animation-delay:calc(var(--i) * 28ms)}
.spine::before{content:"";position:absolute;left:0;top:0;width:100%;height:20px;transform-origin:50% 0;transform:rotateX(-90deg);
  background:repeating-linear-gradient(90deg,#efe8d8 0 2px,#d9d0bd 2px 3px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.spine::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(0,0,0,.22))}
.spine span{position:relative;z-index:1;max-height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine .vb{position:absolute;z-index:1;bottom:7px;left:0;right:0;writing-mode:horizontal-tb;font:700 9.5px/1 var(--gothic);font-style:normal;text-align:center;opacity:.85}
.spine.want{background:transparent;color:var(--sub);outline:1.5px dashed var(--sub);outline-offset:-1.5px}
.spine.want::before,.spine.want::after{display:none}
.spine .rib{position:absolute;z-index:2;top:-14px;right:4px;width:7px;height:34px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);animation:rib 2.4s ease-in-out infinite alternate;transform-origin:top}
@keyframes rib{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.spine:hover{transform:translateY(-8px)}
.spine.out{transform:translateZ(70px) translateY(-26px) rotateY(-16deg)}
@keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(-6deg)}60%{opacity:1;transform:translateY(5px) rotate(1deg)}100%{transform:none}}

.spine .pf{position:absolute;z-index:1;top:0;left:0;right:0;height:15px;background:var(--pc)}
.spine.game{padding-top:22px;border-radius:3px 3px 0 0}

/* ===== つぎのリスト ===== */
.chip.nx{border-color:var(--acc);color:var(--acc)}
.chip.nx.on{color:var(--accInk)}
.chip.shf{border-style:dashed}
.chip.shf.on{border-style:solid}
.shbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 2px 16px;font-size:13px;color:var(--sub)}
.shbar b{font:600 16px/1.2 var(--mincho);color:var(--ink)}
.shbar button{font-size:12.5px;text-decoration:underline;color:var(--sub)}
.ngrp{margin-bottom:24px;animation:rowin .5s var(--ease) both}
.ngrp h3{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;font:600 18px/1.3 var(--mincho)}
.ngrp h3 small{font:500 12px/1 var(--gothic);color:var(--sub)}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.nrow .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.nrow .th{flex:none;width:38px;height:56px;border-radius:2px;overflow:hidden}
.nrow .gen{font-size:8px;padding:3px}
.nrow .tx{min-width:0}
.nrow b{display:block;font:600 15px/1.35 var(--mincho);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow small{display:block;font-size:12.5px;color:var(--sub)}
.nrow small em{font-style:normal;color:var(--acc);font-weight:700}
.nrow .go{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--acc);color:var(--accInk);font-weight:700;font-size:13px;transition:transform .2s var(--spring)}
.nrow .go:active{transform:scale(.9)}
.nrow .due{flex:none;text-align:right;font:600 20px/1 var(--mincho)}
.nrow .due small{font:500 11px/1.3 var(--gothic)}
.nrow .due.soon{color:var(--acc)}

/* ===== 棚：チケット（映画） ===== */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tk{position:relative;display:grid;grid-template-columns:1fr 84px;min-height:112px;text-align:left;color:var(--paperInk);
  animation:tkin .6s var(--spring) both;animation-delay:calc(var(--i) * 45ms);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.tk .l,.tk .r{background:var(--paper)}
.tk .l{position:relative;padding:14px 16px 12px 20px;border-radius:8px 0 0 8px;min-width:0;
  -webkit-mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.tk .l::before{content:"";position:absolute;left:9px;top:13px;bottom:13px;width:3px;border-radius:2px;background:var(--col)}
.tk .r{border-radius:0 8px 8px 0;border-left:2px dashed rgba(0,0,0,.18);display:grid;place-items:center;align-content:center;gap:3px;padding:8px 4px;text-align:center;transition:transform .35s var(--ease);transform-origin:0 100%;
  -webkit-mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.tk .t{font:600 18px/1.3 var(--mincho);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk .m{font-size:12px;color:#6d6158;margin-top:3px}
.tk .r b{font:700 26px/1 var(--mincho);color:#a3283f}
.tk .r small{font-size:10.5px;color:#6d6158}
.tk .r .stars{--sz:10px;color:#d5c9b6}.tk .r .st i{color:#a3283f}
.tk.tear .r{transform:translate(8px,14px) rotate(9deg)}
.tk.want .l,.tk.want .r{background:transparent;color:var(--ink)}
.tk.want{filter:none;outline:1.5px dashed var(--sub);outline-offset:-1px;border-radius:8px}
.tk.want .m,.tk.want .r small{color:var(--sub)}
@keyframes tkin{from{opacity:0;transform:translateX(-30px) rotate(-2deg)}}

/* ===== 棚：額縁（芸術） ===== */
.gallery{columns:2 150px;column-gap:18px;padding-top:10px}
.fr{display:block;width:100%;break-inside:avoid;margin:0 0 30px;text-align:left;transform-origin:50% 0;animation:swing 1.6s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
.fr .wire{display:block;height:22px;position:relative}
.fr .wire::before{content:"";position:absolute;left:50%;top:0;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#8b877e}
.fr .wire::after{content:"";position:absolute;left:18%;right:18%;top:3px;height:19px;background:linear-gradient(to top right,transparent calc(50% - .6px),#8b877e calc(50% - .6px),#8b877e calc(50% + .6px),transparent calc(50% + .6px)) left/50% 100% no-repeat,linear-gradient(to top left,transparent calc(50% - .6px),#8b877e calc(50% - .6px),#8b877e calc(50% + .6px),transparent calc(50% + .6px)) right/50% 100% no-repeat}
.fr .fm{padding:10px;background:#fbfaf6;border:6px solid #23221f;box-shadow:0 14px 22px -12px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.06);transition:transform .3s var(--spring)}
.fr:active .fm{transform:scale(.97)}
.fr .fm>*{display:block;width:100%}
.fr .pl{margin:10px 0 0;padding:6px 8px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08);width:fit-content;max-width:100%}
.fr .pl b{display:block;font:600 13.5px/1.35 var(--mincho)}
.fr .pl small{display:block;font-size:11px;color:var(--sub)}
.fr .pl .stars{--sz:11px}
.fr.want .fm{border-style:dashed;border-color:var(--sub);background:transparent;box-shadow:none}
@keyframes swing{0%{opacity:0;transform:rotate(9deg)}20%{opacity:1;transform:rotate(-6deg)}40%{transform:rotate(3.5deg)}60%{transform:rotate(-1.8deg)}80%{transform:rotate(.7deg)}100%{transform:none}}

/* ===== 表紙：立体の本 ===== */
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:22px 16px;perspective:900px}
.cv{text-align:left;animation:cvin .7s var(--spring) both;animation-delay:calc(var(--i) * 30ms)}
.bk{position:relative;aspect-ratio:2/3;transform-style:preserve-3d;transform:rotateY(var(--ry,-26deg));transition:transform .6s var(--spring)}
.bk.r{--ry:26deg}
.bk .fc{position:absolute;inset:0;border-radius:2px 4px 4px 2px;overflow:hidden;box-shadow:0 10px 18px -8px rgba(0,0,0,.55)}
.bk.r .fc{border-radius:4px 2px 2px 4px}
.bk .ed{position:absolute;top:0;bottom:0;right:0;width:16px;background:var(--col);filter:brightness(.72);transform-origin:100% 50%;transform:rotateY(-90deg)}
.bk.r .ed{right:auto;left:0;transform-origin:0 50%;transform:rotateY(90deg)}
.bk .fc::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-100%);transition:transform .9s var(--ease)}
.cv:hover .bk,.cv:focus-visible .bk{--ry:0deg}
.cv:hover .fc::after{transform:translateX(100%)}
.cv b{display:block;margin-top:10px;font:600 13px/1.35 var(--mincho);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv small{display:block;font-size:11.5px;color:var(--sub)}
.cv .stars{--sz:11px}
.cv.want .bk{opacity:.5}
.poster .bk{--ry:0deg}
.poster .bk .ed{display:none}
.poster .fc{border-radius:3px}
.artc .bk{--ry:0deg;aspect-ratio:1}
.artc .bk .ed{display:none}
.artc .fc{border-radius:0;border:5px solid #23221f;box-shadow:0 10px 16px -10px rgba(0,0,0,.5)}
@keyframes cvin{from{opacity:0;transform:translateY(24px) scale(.94)}}
.ph{position:relative;overflow:hidden;width:100%;height:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.gen{width:100%;height:100%;background:var(--col);color:var(--fg);display:flex;padding:10px;font:600 14px/1.3 var(--mincho);overflow:hidden}
.gen.v{writing-mode:vertical-rl;letter-spacing:.06em}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.3)}
.prog i{display:block;height:100%;background:var(--acc)}

/* ===== 一覧 ===== */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);animation:rowin .5s var(--ease) both;animation-delay:calc(var(--i) * 22ms);transition:background .2s}
.row:active{background:var(--card)}
.row .th{flex:none;width:40px;height:58px;border-radius:2px;overflow:hidden;box-shadow:0 4px 8px -4px rgba(0,0,0,.5)}
.row .gen,.rk .gen{font-size:9px;padding:4px}
.row .tx{flex:1;min-width:0}
.row b{display:block;font:600 15.5px/1.35 var(--mincho);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{flex:none;text-align:right}
.row .rt b{font-size:20px}
.row .rt .stars{--sz:10px}
.pill{display:inline-block;font-size:11px;padding:1px 9px;border-radius:9px;border:1px solid var(--line);color:var(--sub);margin:4px 4px 0 0}
.pill.doing{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
@keyframes rowin{from{opacity:0;transform:translateX(-16px)}}

/* ===== 順位：表彰台 ===== */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:8px 0 22px}
.pd{text-align:center;animation:pdin .8s var(--spring) both}
.pd .th{width:74%;margin:0 auto 8px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;box-shadow:0 14px 22px -10px rgba(0,0,0,.6);transition:transform .3s var(--spring)}
.pd:active .th{transform:scale(.96)}
.pd b.t{display:block;font:600 13px/1.35 var(--mincho);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pd .stars{--sz:11px}
.pd .base{margin-top:8px;border-radius:8px 8px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0;display:grid;place-items:center;align-content:center;gap:2px}
.pd .base span{font:700 34px/1 var(--mincho);color:var(--acc)}
.pd .base small{font-size:12px;color:var(--sub)}
.pd.p1 .base{height:120px}.pd.p2 .base{height:88px}.pd.p3 .base{height:66px}
.pd.p1{animation-delay:.25s}.pd.p2{animation-delay:.1s}.pd.p3{animation-delay:.4s}
@keyframes pdin{from{opacity:0;transform:translateY(40px)}}
.rank{list-style:none;margin:0;padding:0}
.rk{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);animation:rowin .5s var(--ease) both;animation-delay:calc(.45s + var(--i) * 30ms)}
.rk .n{flex:none;width:34px;text-align:center;font:600 24px/1 var(--mincho);color:var(--sub)}
.rk .th{flex:none;width:38px;height:56px;border-radius:2px;overflow:hidden}
.rk .tx{flex:1;min-width:0}
.rk b{display:block;font:600 15px/1.35 var(--mincho)}
.rk small{display:block;font-size:12px;color:var(--sub)}
.rk .stars{--sz:11px}
.rk .sc{flex:none;font:600 20px/1 var(--mincho)}

.empty{padding:60px 16px;text-align:center;color:var(--sub);animation:rowin .6s var(--ease)}
.empty b{display:block;font:600 22px/1.4 var(--mincho);color:var(--ink);margin-bottom:8px}

/* 星 */
.stars{display:inline-flex;gap:1px;font-size:var(--sz,14px);line-height:1;color:var(--line)}
.st{position:relative;display:inline-block}
.st::before{content:"★"}

/* ===== 下の固定バー ===== */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;transform:translateX(-50%);width:min(580px,calc(100% - 20px));height:66px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);
  border-radius:24px;background:color-mix(in srgb,var(--room2) 82%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(0,0,0,.55);transition:background-color .6s var(--ease)}

.fab{position:fixed;right:max(16px,calc(50% - 280px));bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:31;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--accInk);box-shadow:0 14px 28px -10px rgba(0,0,0,.6),0 0 0 6px var(--glow);transition:transform .35s var(--spring),background-color .6s}

.page{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;background:var(--room);color:var(--ink);padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 40px)}

.hero.art .frm{width:min(64vw,300px);padding:12px;background:#fbfaf6;border:8px solid #23221f;box-shadow:0 24px 40px -16px rgba(0,0,0,.55);transition:transform .2s ease-out}
.hero.art .frm .ph{height:auto}
.hero.art .frm img{height:auto}
.ptitle{text-align:center;margin:0 0 4px;font:600 28px/1.35 var(--mincho);animation:rowin .5s .1s var(--ease) both}
.psub{text-align:center;margin:0;color:var(--sub);font-size:13.5px}
.flags{display:flex;gap:8px;justify-content:center;margin:14px 0 6px}
.flag{height:34px;padding:0 14px;border-radius:17px;border:1.5px dashed var(--sub);font-size:13px;color:var(--sub);transition:all .3s var(--spring)}

.sec{margin-top:22px}
.sec>h4{margin:0 0 9px;font-size:12px;font-weight:600;color:var(--sub)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);font-size:14px;color:var(--sub);transition:all .25s var(--spring)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--room)}
.rate{display:flex;align-items:center;gap:14px}
.rate .stars{--sz:38px;gap:5px}
.rate .st{cursor:pointer}
.rate .st.pop{animation:spop .45s var(--spring)}
@keyframes spop{40%{transform:scale(1.4) rotate(-12deg)}}
.rate output{font:600 28px/1 var(--mincho);min-width:2em}
.burst{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--acc);pointer-events:none;z-index:99;animation:burst .6s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.box{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vhead b{font:600 30px/1 var(--mincho)}

.step{display:flex;gap:6px}
.step button{width:42px;height:38px;border-radius:19px;border:1px solid var(--line);font-size:19px;transition:transform .2s var(--spring)}
.step button:active{transform:scale(.85)}
.vshelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px 2px;margin-top:14px;padding:0 2px;background:repeating-linear-gradient(to bottom,transparent 0 46px,var(--shelf) 46px 50px)}
.vshelf button{width:19px;height:46px;border-radius:2px 2px 0 0;border:1px solid var(--line);border-bottom:0;font:700 9px/1 var(--gothic);color:var(--sub);display:grid;place-items:end center;padding-bottom:4px;transition:background .3s,color .3s,transform .3s var(--spring)}
.vshelf button:nth-child(3n){height:43px}.vshelf button:nth-child(4n+1){height:45px}
.vshelf button.rd{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.vshelf button.just{animation:vpop .5s var(--spring)}
@keyframes vpop{40%{transform:translateY(-10px)}}
.vshelf .plus{border-style:dashed;place-items:center;padding:0;font-size:15px}
.vbar{height:10px;border-radius:5px;background:var(--field);overflow:hidden;margin-top:14px}
.vbar i{display:block;height:100%;background:var(--acc);transition:width .4s var(--spring)}
.txt{white-space:pre-wrap;font:16px/1.9 var(--mincho);margin:0}
.vrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.vrow2 b{font:600 20px/1 var(--mincho);color:var(--ink);margin-right:2px}
.vshelf button.own{border:1px solid var(--ink);color:var(--ink)}
.vshelf button.no{border-style:dashed;opacity:.6}
.legend{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--sub)}
.legend i{display:inline-block;width:9px;height:12px;margin-right:4px;vertical-align:-2px;border:1px solid var(--line)}
.legend .a{background:var(--acc);border-color:var(--acc)}.legend .b{border-color:var(--ink)}.legend .c{border-style:dashed}
.roundb{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:9px;background:var(--acc);color:var(--accInk);font:700 11px/1.6 var(--gothic);vertical-align:4px}
.rounds{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--sub)}
.rounds li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
.again{margin-top:12px;font-size:13px;color:var(--sub);text-decoration:underline}
.shchips{display:flex;flex-wrap:wrap;gap:6px}
.shchips button{height:34px;padding:0 13px;border-radius:17px;border:1px dashed var(--line);font-size:13px;color:var(--sub);transition:all .25s var(--spring)}
.shchips button.on{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--card)}
.tl{margin-top:30px;font-size:12px;color:var(--sub)}
.tl summary{cursor:pointer;list-style:none;opacity:.8}
.tl summary::-webkit-details-marker{display:none}
.tl summary::before{content:"＋ "}
.tl[open] summary::before{content:"－ "}
.tl ol{list-style:none;margin:8px 0 0;padding:0 0 0 12px;border-left:1px solid var(--line)}
.tl li{position:relative;padding:3px 0 3px 8px}
.tl li::before{content:"";position:absolute;left:-16px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.tl li span{display:inline-block;min-width:7.2em;margin-right:6px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12.5px;padding:3px 11px;border-radius:12px;border:1px solid var(--line);color:var(--sub)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px;margin:0}
.meta dt{color:var(--sub)}.meta dd{margin:0}
.btn{height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);font-weight:700;font-size:15px;transition:transform .2s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.sm{height:40px;font-size:14px}
.btn.dan{color:#ff8a80}
body[data-cat="art"] .btn.dan{color:#b3261e}

/* ===== シート（編集・設定） ===== */
dialog{width:100%;max-width:640px;margin:auto auto 0;padding:0;border:0;border-radius:24px 24px 0 0;background:var(--room2);color:var(--ink);max-height:94dvh}
dialog[open]{animation:sheet .42s var(--ease)}
dialog::backdrop{background:rgba(5,6,10,.5)}
@keyframes sheet{from{transform:translateY(100%)}}
@media (min-width:680px){dialog{margin:auto;border-radius:24px}}
.sh{padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);display:grid;gap:15px}
.sh::before{content:"";justify-self:center;width:38px;height:5px;border-radius:3px;background:var(--line)}
.sh h3{margin:0;font:600 21px/1.3 var(--mincho)}

label.f{display:grid;gap:5px;font-size:12.5px;color:var(--sub)}
label.f input,label.f textarea,label.f select{width:100%;min-height:46px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:16px;color:var(--ink)}
label.f textarea{min-height:100px;resize:vertical;line-height:1.75}
label.f input:focus,label.f textarea:focus{outline:0;border-color:var(--acc)}
label.f input::placeholder,label.f textarea::placeholder{color:var(--sub);opacity:.7}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.tg small{display:block;font-size:12px;color:var(--sub)}
.sw2{flex:none;width:48px;height:29px;border-radius:15px;background:var(--line);position:relative;transition:background .25s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .35s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw2[aria-checked=true]{background:var(--acc)}
.sw2[aria-checked=true]::after{transform:translateX(19px)}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.photo{display:flex;gap:14px;align-items:center}
.photo .pv{flex:none;width:86px;height:124px;border-radius:4px;overflow:hidden;background:var(--field);position:relative}
.photo .pa{display:grid;gap:7px;flex:1}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.sws button{width:28px;height:28px;border-radius:50%;background:var(--s);border:2px solid var(--line);transition:transform .2s var(--spring)}
.sws button.on{border-color:var(--ink);transform:scale(1.12)}
.blk{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.erate .stars{--sz:32px;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:99;transform:translate(-50%,20px) scale(.96);opacity:0;padding:11px 18px;border-radius:20px;background:var(--acc);color:var(--accInk);font-weight:700;font-size:14px;transition:all .4s var(--spring);pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}

::view-transition-group(hero){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,.8,.24,1)}

<dialog id="dSet"><div class="sh">
  <h3>設定</h3>
  <p class="hint">記録と写真はこの端末の中だけに保存してる。機種変更や念のために、たまにバックアップしておくと安心。</p>
  <div class="acts"><button class="btn sm" data-act="export">バックアップを保存</button><button class="btn sm" data-act="import">バックアップから戻す</button></div>

</div></dialog>

<input type="file" id="imp" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const KEY = 'kura.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const today = () => new Date().toLocaleDateString('sv-SE');
const int = (v) => { const n = parseInt(String(v).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)), 10); return isFinite(n) && n >= 0 ? n : 0; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== 部屋ごとの言葉 ===== */
const CATS = {
  manga: { name: '漫画', unit: '冊', creator: '作者', vol: '巻', st: [['none', '未読'], ['doing', '読んでる'], ['done', '読んだ'], ['pause', '中断']], later: 'あとで読む', vert: true, shelf: 'spine', side: 'right', verb: '読む', room: '#23317a', own: true },
  movie: { name: '映画', unit: '本', creator: '監督', vol: '作', st: [['none', 'まだ'], ['doing', 'シリーズ途中'], ['done', '観た'], ['pause', '中断']], later: 'あとで観る', vert: false, shelf: 'ticket', side: '', verb: '観る', room: '#3d0c18' },
  book: { name: '本', unit: '冊', creator: '著者', vol: '巻', st: [['none', '未読'], ['doing', '読んでる'], ['done', '読んだ'], ['pause', '中断']], later: 'あとで読む', vert: true, shelf: 'spine', side: 'right', verb: '読む', room: '#143c2f', own: true },
  game: { name: 'ゲーム', unit: '本', creator: '開発・メーカー', vol: '作', st: [['none', '未プレイ'], ['doing', 'プレイ中'], ['done', 'クリア'], ['pause', '中断']], later: 'あとで遊ぶ', vert: false, shelf: 'spine', side: 'left', verb: '遊ぶ', room: '#2a1d52' },
  art: { name: '芸術', unit: '点', creator: '作家', vol: '点', st: [['none', 'まだ'], ['done', '見た']], later: '見に行きたい', vert: false, shelf: 'frame', side: '', verb: '見る', room: '#ecebe7' },
};
const ORDER = ['manga', 'movie', 'book', 'game', 'art'];
const PF = [[/switch|スイッチ/i, '#e4002b'], [/ps|プレステ|playstation/i, '#1f5fd1'], [/xbox/i, '#1a8a1a'], [/pc|steam/i, '#5b6170'], [/スマホ|ios|android|iphone/i, '#e8a020']];
const pfColor = (p) => (PF.find(([r]) => r.test(p || '')) || [0, '#8a8fa3'])[1];
const stLabel = (cat, st) => (CATS[cat].st.find((s) => s[0] === st) || CATS[cat].st[0])[1];
const PALETTE = ['#c94f3d', '#e0a43a', '#3f7d5a', '#2f5d9e', '#7a3f8a', '#1f6f78', '#b5546f', '#58606e', '#d8c7a6', '#efe9dc', '#2b2b30', '#8c6a3f'];

/* ===== データ（前の版と同じ形） ===== */
const DEF = () => ({ v: 1, cat: 'manga', view: { manga: 'shelf', movie: 'shelf', book: 'shelf', game: 'shelf', art: 'shelf' }, sort: 'new', items: [], shelves: [] });
let S = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.items)) {
      const o = { ...DEF(), ...d, view: { ...DEF().view, ...d.view }, shelves: Array.isArray(d.shelves) ? d.shelves : [] };
      for (const x of o.items) { if (!x.log) x.log = [{ t: x.created, k: 'add' }].concat(x.status === 'done' ? [{ t: whenT(x.date), k: 'st', v: 'done', d: x.date || '?' }] : []); x.rounds = x.rounds || []; x.round = x.round || 1; x.sh = x.sh || []; }
      return o;
    }
  } catch (e) {}
  return DEF();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存できなかった（保存領域がいっぱいかも）'); } }
const ui = { filter: 'all', q: '' };

/* 写真（IndexedDB） */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('kura', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = (mode, fn) => open().then((db) => new Promise((res, rej) => { const t = db.transaction('img', mode), q = fn(t.objectStore('img')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: (k) => run('readonly', (s) => s.get(k)), set: (k, v) => run('readwrite', (s) => s.put(v, k)), del: (k) => run('readwrite', (s) => s.delete(k)) };
})();
const urls = new Map();
async function imgURL(id) {
  if (urls.has(id)) return urls.get(id);
  try { const b = await idb.get(id); if (!b) return null; const u = URL.createObjectURL(b); urls.set(id, u); return u; } catch (e) { return null; }
}
async function hydrate(root = document) {
  for (const el of $$('[data-img]', root)) {
    const u = await imgURL(el.dataset.img);
    if (!u || !el.isConnected) continue;
    const im = new Image(); im.alt = ''; im.decoding = 'async'; im.src = u;
    const g = [...el.children].find((c) => !c.classList.contains('prog'));
    if (g) g.replaceWith(im); else el.prepend(im);
  }
}
function shrink(file) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const t = document.createElement('canvas'); t.width = t.height = 8; const tx = t.getContext('2d'); tx.drawImage(c, 0, 0, 8, 8);
      const d = tx.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
      const avg = '#' + [r, g, b].map((v) => Math.round(v / 64 * 0.85).toString(16).padStart(2, '0')).join('');
      c.toBlob((bl) => { URL.revokeObjectURL(u); bl ? res({ blob: bl, color: avg, ratio: c.width / c.height }) : rej(); }, 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(); };
    im.src = u;
  });
}

/* ===== 小物 ===== */
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
const colOf = (it) => it.color || PALETTE[hash(it.title + it.id) % 10];
function fgOf(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000 > 150 ? '#1d2433' : '#f7f6f2'; }
function starsHTML(r) {
  let h = `<span class="stars" aria-label="評価 ${r || 0}">`;
  for (let i = 1; i <= 5; i++) h += `<span class="st" style="--f:${r >= i ? 100 : r >= i - 0.5 ? 50 : 0}%"><i></i></span>`;
  return h + '</span>';
}
const progBar = (it) => it.series && it.vols ? `<span class="prog"><i style="width:${Math.min(100, it.cur / it.vols * 100)}%"></i></span>` : '';
function phHTML(it, vert, prog = true) {
  const c = colOf(it);
  return `<div class="ph" ${it.img ? `data-img="${esc(it.id)}"` : ''}><div class="gen${vert ? ' v' : ''}" style="--col:${c};--fg:${fgOf(c)}">${esc(it.title)}</div>${prog ? progBar(it) : ''}</div>`;
}
const volText = (it) => it.series && it.vols ? `${it.cur}/${it.vols}${CATS[it.cat].vol}` : '';
const meta = (x) => [x.creator, x.platform, x.year].filter(Boolean).join('　');
/* 日付：'2015' / '2015-05' / '2015-05-03' / '' */
function fmtWhen(d) {
  if (!d) return '時期不明';
  const [y, m, dd] = d.split('-');
  return dd ? `${+y}/${+m}/${+dd}` : m ? `${+y}年${+m}月` : `${+y}年`;
}
function whenT(d) { return !d ? 0 : new Date(d.length === 4 ? d + '-01-01T12:00' : d.length === 7 ? d + '-01T12:00' : d + 'T12:00').getTime(); }
/* 履歴（同じ日の同じ種類はまとめる） */
function logEv(x, k, v) {
  x.log = x.log || [];
  const d = new Date().toDateString(), last = x.log[x.log.length - 1];
  if (last && last.k === k && new Date(last.t).toDateString() === d && k !== 'add') { last.v = v; last.t = Date.now(); }
  else x.log.push({ t: Date.now(), k, v });
  if (x.log.length > 120) x.log = x.log.slice(-120);
}
function logText(x, e) {
  const C = CATS[x.cat], u = C.vol;
  switch (e.k) {
    case 'add': return '追加した';
    case 'st': return e.v === 'doing' ? (x.cat === 'game' ? 'プレイを始めた' : x.cat === 'movie' ? '観はじめた' : '読みはじめた') : `「${stLabel(x.cat, e.v)}」にした`;
    case 'rate': return e.v ? `★${e.v}をつけた` : '評価を消した';
    case 'cur': return `${e.v}${u}まで${x.cat === 'movie' ? '観た' : x.cat === 'game' ? '遊んだ' : '読んだ'}`;
    case 'own': return `${e.v}${u}まで持ってる`;
    case 'vols': return `${e.v}${u}目が出た`;
    case 'round': return `${e.v}回目を始めた`;
    case 'sh': return `棚「${e.v}」に入れた`;
    default: return '';
  }
}
const shelvesOf = (cat) => (S.shelves || []).filter((h) => h.cat === cat);

/* ===== 絞り込み ===== */
const itemsOf = (cat) => S.items.filter((x) => x.cat === cat);
function visible() {
  const q = ui.q.toLowerCase();
  let a = itemsOf(S.cat);
  if (ui.filter === 'want') a = a.filter((x) => x.want);
  else if (ui.filter === 'later') a = a.filter((x) => x.later);
  else if (ui.filter.startsWith('sh:')) a = a.filter((x) => (x.sh || []).includes(ui.filter.slice(3)));
  else if (ui.filter !== 'all') a = a.filter((x) => x.status === ui.filter);
  if (q) a = a.filter((x) => [x.title, x.creator, x.memo, x.place, ...(x.tags || [])].join(' ').toLowerCase().includes(q));
  const by = { new: (x, y) => y.created - x.created, upd: (x, y) => y.updated - x.updated, rate: (x, y) => (y.rating || 0) - (x.rating || 0) || y.updated - x.updated, title: (x, y) => x.title.localeCompare(y.title, 'ja') };
  return a.sort(by[S.sort] || by.new);
}

/* ===== 描画 ===== */
let lastCat = null;
function render() {
  const C = CATS[S.cat], changed = lastCat !== S.cat;
  document.body.dataset.cat = S.cat;
  $('meta[name="theme-color"]').content = C.room;
  if (changed) {
    const g = $('#giant');
    for (const old of $$('span', g)) { if (old.classList.contains('out')) { old.remove(); continue; } old.classList.add('out'); setTimeout(() => old.remove(), 450); }
    const sp = document.createElement('span'); sp.textContent = C.name; g.append(sp); g.style.setProperty('--gl', [...C.name].length);
    $('#roomName').innerHTML = `<span>${C.name}</span>`;
  }
  $$('#dock .dk').forEach((b, i) => { const on = b.dataset.cat === S.cat; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); if (on) $('#dock .ind').style.transform = `translateX(${i * 100}%)`; });
  const all = itemsOf(S.cat), done = all.filter((x) => x.status === 'done').length, rated = all.filter((x) => x.rating > 0);
  const avg = rated.length ? rated.reduce((a, x) => a + x.rating, 0) / rated.length : 0;
  $('#stat').innerHTML = `<span><b class="num" data-cnt="${all.length}">${all.length}</b>${C.unit}</span><span>${C.st.find((s) => s[0] === 'done')[1]}<b class="num" data-cnt="${done}">${done}</b></span><span>平均<b class="num" data-cnt="${avg.toFixed(1)}" data-dec="1">${rated.length ? avg.toFixed(1) : '—'}</b></span>`;
  if (changed && !reduced) countUp();
  const n = (f) => all.filter(f).length;
  if (ui.filter.startsWith('sh:') && !shelvesOf(S.cat).some((h) => 'sh:' + h.id === ui.filter)) ui.filter = 'all';
  const chips = [['all', 'すべて', all.length], ...C.st.map(([k, l]) => [k, l, n((x) => x.status === k)]), ['want', 'ほしい', n((x) => x.want)], ['later', C.later, n((x) => x.later)]];
  $('#chips').innerHTML = `<button class="chip nx${ui.filter === 'next' ? ' on' : ''}" data-filter="next">つぎ<small>${nextCount()}</small></button>` +
    chips.map(([k, l, c]) => `<button class="chip${ui.filter === k ? ' on' : ''}" data-filter="${k}">${l}<small>${c}</small></button>`).join('') +
    shelvesOf(S.cat).map((h) => `<button class="chip shf${ui.filter === 'sh:' + h.id ? ' on' : ''}" data-filter="sh:${esc(h.id)}">${esc(h.name)}<small>${n((x) => (x.sh || []).includes(h.id))}</small></button>`).join('') +
    `<button class="chip shf" data-act="newshelf">＋ 棚をつくる</button>`;
  const view = S.view[S.cat];
  $$('#views button').forEach((b, i) => { const on = b.dataset.view === view; b.classList.toggle('on', on); if (on) $('#views .vi').style.transform = `translateX(${i * 36}px)`; });
  $('#sort').value = S.sort;
  lastCat = S.cat;
  drawList();
}
function countUp() {
  for (const el of $$('#stat [data-cnt]')) {
    const to = +el.dataset.cnt, dec = +(el.dataset.dec || 0); if (!to) continue;
    const t0 = performance.now();
    const f = (t) => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = (to * e).toFixed(dec); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }
}
function drawList() {
  const C = CATS[S.cat], view = S.view[S.cat], el = $('#list');
  if (ui.filter === 'next') return drawNext();
  let a = visible();
  const shb = ui.filter.startsWith('sh:') ? shelvesOf(S.cat).find((h) => 'sh:' + h.id === ui.filter) : null;
  const shHead = shb ? `<div class="shbar"><b>${esc(shb.name)}</b><span>${a.length}${C.unit}</span><button data-act="shren">名前を変える</button><button data-act="shdel">この棚を消す</button></div>` : '';
  if (view === 'rank') a = a.filter((x) => x.rating > 0).sort((x, y) => y.rating - x.rating || y.updated - x.updated);
  if (!a.length) {
    const none = !itemsOf(S.cat).length;
    el.innerHTML = shHead + `<div class="empty"><b>${none ? `${C.name}の部屋はまだ空っぽ` : shb ? 'この棚はまだ空っぽ' : view === 'rank' ? 'まだ星をつけたものがない' : '当てはまるものがない'}</b>${none ? '右下の＋から、気になるものを置いていこう。' : shb ? '作品を開いて、下の「棚」からこの棚を選ぶと入る。' : view === 'rank' ? '作品を開いて星をつけると、ここに表彰台ができる。' : '絞り込みや検索を変えてみて。'}</div>`;
    return;
  }
  const I = (i) => Math.min(i, 30);
  if (view === 'shelf' && C.shelf === 'spine') {
    el.innerHTML = `<div class="shelf">${a.map((x, i) => {
      const c = colOf(x), h = 150 + hash(x.id) % 34 + Math.min(x.title.length, 10) * 1.3, w = Math.round(30 + (x.series ? Math.min(x.vols || 1, 40) * 0.9 : 0) + (x.title.length > 14 ? 4 : 0));
      const vb = x.series && x.vols ? `${x.cur}/${x.vols}` : x.rating ? '★' + x.rating : '';
      const gm = x.cat === 'game';
      return `<div class="sw"><button class="spine vt${gm ? ' game' : ''}${x.want ? ' want' : ''}${x.status === 'doing' ? ' doing' : ''}" data-id="${esc(x.id)}" style="--w:${gm ? Math.max(w, 34) : w}px;--h:${Math.round(gm ? 186 : h)}px;--col:${c};--fg:${fgOf(c)};--i:${I(i)}${gm ? `;--pc:${pfColor(x.platform)}` : ''}" aria-label="${esc(x.title)}">${gm && !x.want ? '<i class="pf"></i>' : ''}${x.status === 'doing' ? '<i class="rib"></i>' : ''}<span>${esc(x.title)}</span>${vb ? `<em class="vb">${esc(vb)}</em>` : ''}</button></div>`;
    }).join('')}</div>`;
  } else if (view === 'shelf' && C.shelf === 'ticket') {
    el.innerHTML = `<div class="tickets">${a.map((x, i) => `<button class="tk${x.want ? ' want' : ''}" data-id="${esc(x.id)}" style="--col:${colOf(x)};--i:${I(i)}"><div class="l"><div class="t">${esc(x.title)}</div><div class="m">${esc(meta(x)) || '&nbsp;'}</div><div class="m">${esc(stLabel(x.cat, x.status))}${x.series && x.vols ? '　' + volText(x) : ''}${x.later ? '　' + C.later : ''}</div></div><div class="r">${x.rating ? `<b class="num">${x.rating}</b>${starsHTML(x.rating)}` : '<small>評価<br>まだ</small>'}${x.date ? `<small class="num">${esc(fmtWhen(x.date))}</small>` : ''}</div></button>`).join('')}</div>`;
  } else if (view === 'shelf') {
    el.innerHTML = `<div class="gallery">${a.map((x, i) => `<button class="fr${x.want ? ' want' : ''}" data-id="${esc(x.id)}" style="--i:${I(i)}"><span class="wire"></span><div class="fm vt" ${x.img ? `data-img="${esc(x.id)}"` : ''}>${x.img ? `<div style="aspect-ratio:${x.ratio || 0.8};background:var(--field)"></div>` : `<div class="gen" style="--col:${colOf(x)};--fg:${fgOf(colOf(x))};aspect-ratio:${0.7 + hash(x.id) % 6 / 10}">${esc(x.title)}</div>`}</div><div class="pl"><b>${esc(x.title)}</b><small>${esc(meta(x))}</small>${x.place ? `<small>${esc(x.place)}</small>` : ''}${x.rating ? starsHTML(x.rating) : ''}</div></button>`).join('')}</div>`;
  } else if (view === 'cover') {
    const kind = C.side ? '' : S.cat === 'movie' ? ' poster' : ' artc';
    el.innerHTML = `<div class="covers">${a.map((x, i) => `<button class="cv${kind}${x.want ? ' want' : ''}" data-id="${esc(x.id)}" style="--i:${I(i)};--col:${colOf(x)}"><div class="bk vt${C.side === 'right' ? '' : ' r'}"><div class="fc">${phHTML(x, C.vert)}</div><span class="ed"></span></div><b>${esc(x.title)}</b><small>${x.rating ? starsHTML(x.rating) : esc(stLabel(x.cat, x.status))}</small></button>`).join('')}</div>`;
  } else if (view === 'list') {
    el.innerHTML = `<ul class="rows">${a.map((x, i) => `<li><button class="row" data-id="${esc(x.id)}" style="--i:${I(i)}"><span class="th vt">${phHTML(x, C.vert)}</span><span class="tx"><b>${esc(x.title)}</b><small>${esc(meta(x)) || '　'}</small><span class="pill${x.status === 'doing' ? ' doing' : ''}">${esc(stLabel(x.cat, x.status))}${x.series && x.vols ? '　' + volText(x) : ''}</span>${x.round > 1 ? `<span class="pill">${x.round}回目</span>` : ''}${x.hours ? `<span class="pill">${x.hours}時間</span>` : ''}${x.want ? '<span class="pill">ほしい</span>' : ''}${x.later ? `<span class="pill">${C.later}</span>` : ''}</span><span class="rt">${x.rating ? `<b class="num">${x.rating}</b><br>${starsHTML(x.rating)}` : '<small>—</small>'}</span></button></li>`).join('')}</ul>`;
  } else {
    const top = a.slice(0, 3), rest = a.slice(3);
    let prev = null, rk = 0;
    const ranks = a.map((x, i) => { if (x.rating !== prev) { rk = i + 1; prev = x.rating; } return rk; });
    const pd = (x, k) => x ? `<button class="pd p${k + 1}" data-id="${esc(x.id)}"><div class="th vt">${phHTML(x, C.vert)}</div><b class="t">${esc(x.title)}</b>${starsHTML(x.rating)}<div class="base"><span class="num">${ranks[k]}</span><small class="num">${x.rating}</small></div></button>` : '<div></div>';
    el.innerHTML = `<div class="podium">${pd(top[1], 1)}${pd(top[0], 0)}${pd(top[2], 2)}</div>` +
      (rest.length ? `<ol class="rank">${rest.map((x, j) => `<li><button class="rk" data-id="${esc(x.id)}" style="--i:${I(j)}"><span class="n num">${ranks[j + 3]}</span><span class="th vt">${phHTML(x, C.vert)}</span><span class="tx"><b>${esc(x.title)}</b><small>${esc(meta(x))}</small>${starsHTML(x.rating)}</span><span class="sc num">${x.rating}</span></button></li>`).join('')}</ol>` : '');
  }
  if (shHead) el.insertAdjacentHTML('afterbegin', shHead);
  hydrate(el);
}

/* ===== つぎのリスト ===== */

  Object.assign(x, { status: draft.status, rating: draft.rating, want: draft.want, later: draft.later, series: draft.series, done: draft.done, color: draft.color }, v, { updated: now });
  x.log.sort((a, b) => a.t - b.t);
  if (isNew && ui.filter.startsWith('sh:') && S.cat === x.cat) x.sh = [ui.filter.slice(3)];
  try {
    if (draft.newImg) { await idb.set(x.id, draft.newImg.blob); urls.delete(x.id); x.img = true; x.ratio = +draft.newImg.ratio.toFixed(3); if (!draft.color) x.color = draft.newImg.color; }
    else if (draft.rmImg && x.img) { await idb.del(x.id); urls.delete(x.id); x.img = false; }
  } catch (err) { toast('写真を保存できなかった'); }
  save(); render();
  if (curId === x.id && !$('#page').hidden) renderPage(x);
  toast(draft.id ? '保存した' : `「${title}」を置いた`);
});

/* ===== 書き出し・読み込み ===== */
const blobToData = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function doExport() {
  const imgs = {};
  for (const x of S.items) if (x.img) { try { const b = await idb.get(x.id); if (b) imgs[x.id] = await blobToData(b); } catch (e) {} }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ ...S, imgs })], { type: 'application/json' }));
  a.download = `kura-${today()}.json`; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  toast('バックアップを保存した');
}
async function doImport(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.items)) throw 0;
    const have = new Set(S.items.map((x) => x.id)); let n = 0;
    for (const x of d.items) {
      if (!x || !x.id || have.has(x.id) || !CATS[x.cat] || !x.title) continue;
      x.log = x.log || [{ t: x.created || Date.now(), k: 'add' }]; x.rounds = x.rounds || []; x.round = x.round || 1; x.sh = x.sh || [];
      S.items.push(x); n++;
      if (x.img && d.imgs && d.imgs[x.id]) { try { await idb.set(x.id, await (await fetch(d.imgs[x.id])).blob()); } catch (e) { x.img = false; } } else x.img = false;
    }
    if (Array.isArray(d.shelves)) { const hs = new Set(S.shelves.map((h) => h.id)); for (const h of d.shelves) if (h && h.id && !hs.has(h.id) && CATS[h.cat]) S.shelves.push(h); }
    save(); render(); toast(`${n}件を戻した`);
  } catch (e) { toast('読み込めなかった（蔵のバックアップじゃないかも）'); }
}

/* ===== 操作 ===== */
document.addEventListener('click', (e) => {
  const t = e.target;
  const dk = t.closest('.dk'); if (dk) { if (dk.dataset.cat !== S.cat) { S.cat = dk.dataset.cat; ui.filter = 'all'; ui.q = ''; $('#q').value = ''; save(); scrollTo({ top: 0 }); render(); } return; }
  const fl = t.closest('[data-filter]'); if (fl) { ui.filter = fl.dataset.filter; render(); return; }
  const vw = t.closest('[data-view]'); if (vw) { S.view[S.cat] = vw.dataset.view; save(); render(); return; }
  const nx = t.closest('[data-nx]');
  if (nx) {
    const it = S.items.find((i) => i.id === nx.dataset.nid); if (!it) return;
    if (nx.dataset.nx === 'own') { it.own = Math.min(it.vols, (+it.own || 0) + 1); logEv(it, 'own', it.own); toast(`${it.own}${CATS[it.cat].vol}を買った`); }
    else { it.cur = Math.min(it.vols, it.cur + 1); logEv(it, 'cur', it.cur); autoStatus(it); if (it.status === 'none') setStatus(it, 'doing'); toast(`${it.cur}${CATS[it.cat].vol}まで進めた`); }
    touch(it); render(); return;
  }
  const op = t.closest('[data-oid]'); if (op) { openItem(op.dataset.oid, op); return; }
  const card = t.closest('#list [data-id]');
  if (card) {
    if (card.classList.contains('spine') && !reduced) { card.classList.add('out'); setTimeout(() => { card.classList.remove('out'); openItem(card.dataset.id, card); }, 260); }
    else if (card.classList.contains('tk') && !reduced) { card.classList.add('tear'); setTimeout(() => { card.classList.remove('tear'); openItem(card.dataset.id, null); }, 300); }
    else openItem(card.dataset.id, card);
    return;
  }
  const x = curId && !$('#page').hidden ? S.items.find((i) => i.id === curId) : null;
  if (x) {
    const st = t.closest('[data-st]'); if (st) { setStatus(x, st.dataset.st); touch(x); drawSt(x); if (x.series) drawVols(x); drawTl(x); return; }
    const fg = t.closest('[data-flag]'); if (fg) { x[fg.dataset.flag] = !x[fg.dataset.flag]; touch(x); drawFlags(x); return; }
    const sr = t.closest('#pRate [data-star]'); if (sr) {
      const i = +sr.dataset.star; x.rating = x.rating === i ? i - 0.5 : i; logEv(x, 'rate', x.rating); touch(x);
      drawRate(x); drawTl(x); const s = $(`#pRate [data-star="${i}"]`); s.classList.add('pop'); burst(s); return;
    }
    const vo = t.closest('[data-vol]'); if (vo) { const v = +vo.dataset.vol; x.cur = x.cur === v ? v - 1 : v; logEv(x, 'cur', x.cur); autoStatus(x); touch(x); drawVols(x, v); drawSt(x); drawTl(x); return; }
    const vs = t.closest('[data-vstep]'); if (vs) {
      x.cur = Math.max(0, x.cur + +vs.dataset.vstep); if (x.vols && x.cur > x.vols) { if (x.done) x.cur = x.vols; else x.vols = x.cur; }
      logEv(x, 'cur', x.cur); autoStatus(x); touch(x); drawVols(x, x.cur); drawSt(x); drawTl(x); return;
    }
    const os = t.closest('[data-ostep]'); if (os) {
      const cur = x.own != null && x.own !== '' ? +x.own : x.cur; x.own = Math.max(0, Math.min(x.vols || 9999, cur + +os.dataset.ostep));
      logEv(x, 'own', x.own); touch(x); drawVols(x); drawTl(x); return;
    }
    const si = t.closest('[data-shin]'); if (si) {
      const id = si.dataset.shin; x.sh = x.sh || [];
      if (x.sh.includes(id)) x.sh = x.sh.filter((s) => s !== id); else { x.sh.push(id); logEv(x, 'sh', (shelvesOf(x.cat).find((h) => h.id === id) || {}).name); }
      touch(x); drawShelves(x); drawTl(x); return;
    }
  }
  const est = t.closest('[data-est]'); if (est) { draft.status = est.dataset.est; $$('#stSeg button').forEach((b) => b.classList.toggle('on', b === est)); drawWhen(); return; }
  const wmb = t.closest('[data-wm]'); if (wmb) { draft.date = whenValue() || draft.date; draft.wm = wmb.dataset.wm; drawWhen(); return; }
  const es = t.closest('#editRate [data-star]'); if (es) { const i = +es.dataset.star; draft.rating = draft.rating === i ? i - 0.5 : i; drawEditRate(); $(`#editRate [data-star="${i}"]`).classList.add('pop'); return; }
  const sw = t.closest('[data-sw]'); if (sw) { draft.color = draft.color === sw.dataset.sw ? '' : sw.dataset.sw; drawSwatches(); drawPhoto(); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'new': openEdit(null); break;
    case 'edit': openEdit(curId); break;
    case 'back': closeItem(); break;
    case 'close': a.closest('dialog').close(); break;
    case 'settings': $('#dSet').showModal(); break;
    case 'rateclear': if (x) { x.rating = 0; logEv(x, 'rate', 0); touch(x); drawRate(x); drawTl(x); } break;
    case 'erateclear': draft.rating = 0; drawEditRate(); break;
    case 'volplus': if (x) { x.vols = (x.vols || 0) + 1; logEv(x, 'vols', x.vols); touch(x); drawVols(x, x.vols); drawTl(x); toast(`${x.vols}${CATS[x.cat].vol}を足した`); } break;
    case 'again':
      if (x && confirm(`もう一度${CATS[x.cat].verb}？\n今回の評価と日付は「${x.round || 1}回目」として残るよ。`)) {
        x.rounds = x.rounds || []; x.rounds.push({ n: x.round || 1, date: x.date || '', rating: x.rating || 0 });
        x.round = (x.round || 1) + 1; x.rating = 0; x.date = ''; if (x.series) x.cur = 0;
        logEv(x, 'round', x.round); x.status = 'doing'; touch(x); renderPage(x); toast(`${x.round}回目を始めた`);
      }
      break;
    case 'newshelf': {
      const name = (prompt(`${CATS[S.cat === (x && x.cat) || !x ? S.cat : x.cat].name}の新しい棚の名前（例：殿堂入り）`) || '').trim().slice(0, 20);
      if (!name) break;
      const cat = x ? x.cat : S.cat;
      if (shelvesOf(cat).some((h) => h.name === name)) { toast('同じ名前の棚がもうある'); break; }
      const h = { id: uid(), name, cat }; S.shelves.push(h);
      if (x) { x.sh = x.sh || []; x.sh.push(h.id); logEv(x, 'sh', name); touch(x); drawShelves(x); drawTl(x); } else { ui.filter = 'sh:' + h.id; }
      save(); render(); toast(`棚「${name}」をつくった`);
      break;
    }
    case 'shren': {
      const h = shelvesOf(S.cat).find((q) => 'sh:' + q.id === ui.filter); if (!h) break;
      const name = (prompt('新しい名前', h.name) || '').trim().slice(0, 20); if (!name) break;
      h.name = name; save(); render(); break;
    }
    case 'shdel': {
      const h = shelvesOf(S.cat).find((q) => 'sh:' + q.id === ui.filter); if (!h) break;
      if (confirm(`棚「${h.name}」を消す？\n中の作品は消えないよ。`)) { S.shelves = S.shelves.filter((q) => q !== h); for (const it of S.items) if (it.sh) it.sh = it.sh.filter((s) => s !== h.id); ui.filter = 'all'; save(); render(); toast('棚を消した'); }
      break;
    }
    case 'photorm': draft.newImg = null; draft.rmImg = true; drawPhoto(); break;
    case 'delete': {
      const it = S.items.find((i) => i.id === draft.id);
      if (it && confirm(`「${it.title}」を消す？`)) {
        S.items = S.items.filter((i) => i !== it); if (it.img) idb.del(it.id).catch(() => {});
        save(); $('#dEdit').close(); if (curId === it.id) { $('#page').hidden = true; document.body.classList.remove('paged'); curId = null; } render(); toast('消した');
      }
      break;
    }
    case 'export': doExport(); break;
    case 'import': $('#imp').click(); break;
    case 'wipe':
      if (confirm('すべての記録と写真を消す？（元に戻せない）') && confirm('本当に消していい？')) {
        for (const it of S.items) if (it.img) idb.del(it.id).catch(() => {});
        S = DEF(); save(); $('#dSet').close(); lastCat = null; render(); toast('全部消した');
      }
      break;
  }
});
$('#serSw').addEventListener('click', () => { draft.series = !draft.series; setSw('#serSw', draft.series); $('#serF').hidden = !draft.series; });
$('#doneSw').addEventListener('click', () => { draft.done = !draft.done; setSw('#doneSw', draft.done); });
$$('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
$('#q').addEventListener('input', (e) => { ui.q = e.target.value.trim(); drawList(); });
$('#sort').addEventListener('change', (e) => { S.sort = e.target.value; save(); drawList(); });
$('#imp').addEventListener('change', (e) => { if (e.target.files[0]) doImport(e.target.files[0]); e.target.value = ''; });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#page').hidden && !$('dialog[open]')) closeItem(); });
// 背景の大きな文字をスクロールに合わせてゆっくり動かす
let ticking = false;
addEventListener('scroll', () => { if (!ticking && !reduced) { ticking = true; requestAnimationFrame(() => { $('#giant').style.transform = `translateY(${(-scrollY * 0.18).toFixed(1)}px)`; ticking = false; }); } }, { passive: true });

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

render();
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
window.__k = { S: () => S };
})();
</script>
